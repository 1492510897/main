<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>HC</title>
    <style type="text/css">
        @charset "utf-8";

        body,
        div,
        p,
        iframe,
        label,
        input {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        input {
            color: #fafafa;
            font-family: inherit;
            border: none;
            outline: none;
        }

        body {
            font-family: "微软雅黑";
        }

        #app {
            display: flex;
            margin: 0 auto;
            width: 1192px;
            height: 774px;
            padding: 15px;
            background-color: #323232;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
        }

        #aside-bar {
            display: flex;
            flex-direction: column;
            padding: 15px;
            width: 200px;
            border-radius: 12px;
            background-color: #3c3c3c;
        }

        #image {
            --wh: 84px;
            margin: 0 auto;
            margin-top: 9px;
            width: var(--wh);
            height: var(--wh);
            border-radius: 50%;
            background: url("https://q.qlogo.cn/headimg_dl?dst_uin=3184668964&spec=640&img_type=jpg") center / cover no-repeat;
            transition: 0.3s;
            cursor: pointer;
        }

        #image:hover {
            transform: scale(1.1);
        }

        #version {
            margin-top: auto;
        }

        #version>.inner-text {
            --size: 13px;
        }

        #game-area {
            --gw: 950px;
            --gh: 600px;
            margin-left: 12px;
        }

        #container {
            margin: 12px 0;
            width: var(--gw);
            height: var(--gh);
            border-radius: 12px;
            background-color: #3c3c3c;
            overflow: hidden;
        }

        #flash {
            width: 100%;
            height: 100%;
        }

        #cheat-group {
            --iw: 170px;
            --ih: 35px;
            margin-top: 28px;
        }

        .slider-box {
            display: flex;
            padding: 0 5px;
            width: var(--iw);
            height: var(--ih);
            border-radius: 8px;
            background-color: #484848;
        }

        .prev-slider,
        .next-slider {
            --wh: 25px;
            width: var(--wh);
            height: var(--wh);
            padding: 8px;
            margin: auto 0;
            border-radius: 8px;
            background-color: transparent;
            transition: 0.3s;
            cursor: pointer;
        }

        .prev-slider:hover,
        .next-slider:hover {
            background-color: #545454;
        }

        .inner-icon {
            display: block;
            width: 100%;
            height: 100%;
        }

        .inner-icon>path {
            fill: #fafafa;
        }

        .view-slider {
            margin: 0 auto;
        }

        .view-slider>.inner-text {
            line-height: var(--ih);
        }

        .param-group>.param {
            margin-top: 12px;
        }

        .change-btn {
            margin-top: 12px;
            width: var(--iw);
            height: var(--ih);
            line-height: var(--ih);
            color: #fafafa;
            text-align: center;
            font-size: 12px;
            border-radius: 8px;
            background-color: #484848;
            transition: 0.3s;
            cursor: pointer;
        }

        .change-btn:hover {
            background-color: #545454;
        }

        .select-box {
            position: relative;
        }

        .select-panel {
            width: 100%;
            top: 100%;
            left: 0;
            position: absolute;
            border-radius: 8px;
            background-color: #323232;
            overflow-y: hidden;
            transition-property: height;
        }

        .view-select {
            width: 100%;
            height: var(--ih);
            transition: 0.3s;
            cursor: pointer;
        }

        .view-select>.inner-text {
            line-height: var(--ih);
        }

        .view-select:hover {
            background-color: #484848;
        }

        .view-select.last-select {
            border-radius: 0 0 8px 8px;
        }

        .inner-text {
            --size: 12px;
            color: #fafafa;
            text-align: center;
            font-size: var(--size);
            line-height: var(--size);
        }

        .inner-input {
            padding: 0 12px;
            width: var(--iw);
            height: var(--ih);
            line-height: var(--ih);
            font-size: 12px;
            text-align: center;
            border-radius: 8px;
            background-color: #484848;
            position: relative;
        }

        .btn-group {
            display: flex;
            padding: 0 15px;
            width: var(--gw);
            height: 60px;
            border-radius: 12px;
            background-color: #3c3c3c;
        }

        .group-container {
            display: flex;
            margin: auto 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .group-btn {
            --wh: 34px;
            padding: 9px;
            width: var(--wh);
            height: var(--wh);
            background-color: #484848;
            transition: 0.3s;
            cursor: pointer;
        }

        .group-btn:hover {
            background-color: #545454;
        }

        .group-right {
            margin-left: auto;
        }

        #custom-swf {
            flex-grow: 1;
            flex-shrink: 1;
            margin: auto 0;
            height: 34px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #484848;
        }

        #custom-url {
            padding: 0 12px;
            width: 100%;
            height: 100%;
            font-size: 12px;
            background-color: transparent;
            cursor: pointer;
        }

        #custom-btn {
            margin: auto 0;
            margin-left: 12px;
            width: 120px;
            height: 34px;
            color: #fafafa;
            font-size: 12px;
            line-height: 34px;
            text-align: center;
            border-radius: 8px;
            background-color: #484848;
            transition: 0.3s;
            cursor: pointer;
        }

        #custom-btn:hover {
            background-color: #545454;
        }

        #file-picker {
            display: none;
            width: 0;
            height: 0;
        }

        #modal {
            display: flex;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            position: absolute;
            z-index: 999;
            background-color: #00000066;
            transition: opacity 0.5s;
            visibility: hidden;
            opacity: 0;
        }

        #modal[visible] {
            visibility: visible;
            opacity: 1;
        }

        #modal-container {
            display: flex;
            flex-direction: column;
            margin: auto;
            padding: 18px;
            width: 350px;
            border-radius: 12px;
            background-color: #fafafa;
        }

        #modal-header {
            font-size: 14px;
            font-weight: 700;
            line-height: 14px;
        }

        #modal-content {
            margin: 48px 0;
            font-size: 13px;
            line-height: 18px;
            letter-spacing: 1px;
            text-align: center;
        }

        #modal-btn-group {
            display: flex;
            margin-left: auto;
        }

        .modal-btn {
            display: none;
            padding: 12px 36px;
            color: #fafafa;
            font-size: 13px;
            line-height: 13px;
            border-radius: 8px;
            background-color: #165dff;
            cursor: pointer;
        }

        .modal-btn:not(:first-child) {
            margin-left: 10px;
        }
    </style>
</head>

    <script type="text/javascript">
        (function (global) {
            "use strict";
            const template = (function () {
                const temps = {
                    get(compId) {
                        return this.hasOwnProperty(compId) ? this[compId].cloneNode(true) : null;
                    }
                };
                const doc = document.querySelector("#components").content;
                temps.editBox = doc.querySelector(".inner-input");
                temps.selectBox = doc.querySelector(".select-panel");
                temps.selectItem = doc.querySelector(".view-select");
                temps.changeBtn = doc.querySelector(".change-btn");
                temps.sliderBox = doc.querySelector(".slider-box");
                temps.soundOpen = doc.querySelector("[link='sound'][state='open']");
                temps.soundOff = doc.querySelector("[link='sound'][state='off']");
                return temps;
            })();
            const message = {
                btns: ["确定", "取消"],
                modal: document.querySelector("#modal"),
                header: document.querySelector("#modal-header"),
                content: document.querySelector("#modal-content"),
                buttons: document.querySelector("#modal-btn-group"),
                init() {
                    const btns = this.buttons;
                    const confirm = btns.querySelector("#modal-confirm");
                    const cancel = btns.querySelector("#modal-cancel");
                    const callback = this.hide.bind(this);
                    confirm.addEventListener("click", callback);
                    cancel.addEventListener("click", callback);
                    this.init = null;
                },
                show(header = "提示", content = "感谢支持寒尘爆枪突击辅助付费版本", buttons = ["确定"]) {
                    this.modal.setAttribute("visible", "");
                    this.header.textContent = header;
                    this.content.textContent = content;
                    const childs = (() => {
                        const elems = [];
                        for (const elem of this.buttons.children) {
                            elems.push(elem);
                        };
                        return elems;
                    })();
                    buttons.forEach((button) => {

                            cloned.setAttribute("type", type);
                            cloned.addEventListener("click", (e) => {
                                const target = e.currentTarget;
                                const type = target.getAttribute("type");
                                if (type && this.component.hasOwnProperty(type)) this.change(type);
                            });
                            group.appendChild(cloned);
                        };
                    };
                    new sliderBox(main, groups.length - 1, 0, (idx, view) => {
                        groups.forEach((group, __idx) => {
                            const stl = group.style;
                            if (idx === __idx) {
                                const type = group.getAttribute("type");
                                if (this.define.hasOwnProperty(type)) {
                                    this.type = type;
                                    this.curdef = this.define[type];
                                    view.textContent = this.curdef.name;
                                    const select = this.getSelectBox(true);
                                    if (select.__valid) select.updateItems(this.curdef.type);
                                };
                                stl.display = "";
                            } else {
                                stl.display = "none";
                            };
                        });
                    }, false);
                    document.addEventListener("contextmenu", (e) => e.preventDefault());
                    this.init = null;
                },
                change(type) {
                    let data = "#cheating?mode='" + type + "'";
                    const params = this.component[type];
                    for (const key in params) {
                        const param = params[key];
                        data += ("&" + key + "=" + param.get());
                    };
                    call(data);
                },
                addItem(type, name, comp) {
                    if (typeof (comp) !== "object") return;
                    if (comp.hasOwnProperty("__valid") && comp.__valid) {
                        const comps = this.component;
                        if (!comps.hasOwnProperty(type)) comps[type] = {};
                        comps[type][name] = comp;
                    };
                },
                getAllItems() {
                    const compArr = [];
                    const comps = this.component[this.type];
                    for (const param in comps) {
                        const comp = comps[param];
                        compArr.push(comp);
                    };
                    return compArr;
                },
                getEditBox() {
                    const comps = this.getAllItems();
                    return comps.filter((comp) => comp.constructor.name === "editBox");
                },
                getSelectBox(parent) {
                    const comps = this.getAllItems();
                    const filter = comps.filter((comp) => comp.__parent === parent);
                    if (filter.length > 0) return filter[0];
                    return null;
                }
            };
            project.init();
        })(window);
    </script>
</body>
</html>
